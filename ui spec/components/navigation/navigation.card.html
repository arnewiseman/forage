</head><body><div id="root"></div>
<script type="text/babel">
const { Tabs, Stepper } = window.ForageDesignSystem_98e604;

function Demo(){
  const [tab,setTab]=React.useState('roles');
  const [p,setP]=React.useState('gap');
  return (<div className="stack" style={{gap:24}}>
    <Tabs value={tab} onChange={setTab} items={[{id:'roles',label:'Open roles',count:6},{id:'sectors',label:'Growth sectors',icon:'sprout'},{id:'saved',label:'Saved',disabled:true}]} />
    <Tabs variant="pill" value={p} onChange={setP} items={[{id:'gap',label:'Skills gap'},{id:'have',label:'What transfers'},{id:'all',label:'All skills'}]} />
    <Stepper current={2} steps={["Describe","Match","Target","Gap","Roles"]} />
  </div>);}

ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
