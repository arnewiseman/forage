<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--paper-100);font:var(--type-body);color:var(--text-body)}.row{display:flex;gap:var(--space-md);align-items:stretch}.col{display:flex;flex-direction:column;gap:var(--space-sm)}.sw{flex:1 1 0;min-width:0;border-radius:var(--radius-sm);border:1px solid rgba(22,33,28,.10);padding:var(--space-sm);display:flex;flex-direction:column;justify-content:flex-end;height:84px}.n{font:var(--type-mono);font-size:10px;letter-spacing:.02em}.v{font:var(--type-mono);font-size:10px;opacity:.75}.cap{font-family:var(--font-body);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted)}</style></head><body>
<div class="row">
<div class="sw" style="background:var(--paper-000);color:#16211C"><span class="n">paper-000</span><span class="v">#FFFDF8</span></div><div class="sw" style="background:var(--paper-050);color:#16211C"><span class="n">paper-050</span><span class="v">#FAF6EE</span></div><div class="sw" style="background:var(--paper-100);color:#16211C"><span class="n">paper-100</span><span class="v">#F6F1E7</span></div><div class="sw" style="background:var(--paper-200);color:#16211C"><span class="n">paper-200</span><span class="v">#EDE6D8</span></div><div class="sw" style="background:var(--paper-300);color:#16211C"><span class="n">paper-300</span><span class="v">#DFD6C4</span></div><div class="sw" style="background:var(--paper-400);color:#16211C"><span class="n">paper-400</span><span class="v">#C6BBA5</span></div><div class="sw" style="background:var(--rain-500);color:#16211C"><span class="n">rain-500</span><span class="v">#8A9490</span></div><div class="sw" style="background:var(--ink-500);color:#FAF6EE"><span class="n">ink-500</span><span class="v">#4A5751</span></div><div class="sw" style="background:var(--ink-700);color:#FAF6EE"><span class="n">ink-700</span><span class="v">#2C3833</span></div><div class="sw" style="background:var(--ink-900);color:#FAF6EE"><span class="n">ink-900</span><span class="v">#16211C</span></div>
