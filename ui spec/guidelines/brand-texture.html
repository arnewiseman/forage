<!-- @dsCard group="Brand" viewport="700x160" name="Surfaces & backgrounds" subtitle="Flat warm paper. No photography, no gradients — one topographic rule as the only ornament." -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--paper-100);font:var(--type-body);color:var(--text-body)}.row{display:flex;gap:var(--space-md);align-items:stretch}.col{display:flex;flex-direction:column;gap:var(--space-sm)}.sw{flex:1 1 0;min-width:0;border-radius:var(--radius-sm);border:1px solid rgba(22,33,28,.10);padding:var(--space-sm);display:flex;flex-direction:column;justify-content:flex-end;height:0px}.n{font:var(--type-mono);font-size:10px;letter-spacing:.02em}.v{font:var(--type-mono);font-size:10px;opacity:.75}.cap{font-family:var(--font-body);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted)}</style></head><body>
<div class="row" style="gap:12px">
<div style="flex:1 1 0;height:110px;background:var(--paper-100);border:1px solid var(--border-hairline);border-radius:var(--radius-md);display:flex;align-items:flex-end;padding:8px"><span class="v">page — paper-100</span></div>
<div style="flex:1 1 0;height:110px;background:var(--paper-000);border:1px solid var(--border-hairline);border-radius:var(--radius-md);display:flex;align-items:flex-end;padding:8px"><span class="v">card — paper-000</span></div>
<div style="flex:1 1 0;height:110px;background:var(--fir-700);border-radius:var(--radius-md);display:flex;align-items:flex-end;padding:8px;background-image:repeating-linear-gradient(90deg,rgba(255,253,248,.10) 0 1px,transparent 1px 9px)"><span class="v" style="color:var(--paper-200)">inverse + 1px rule</span></div>
<div style="flex:1 1 0;height:110px;background:var(--paper-200);border:1px solid var(--paper-300);border-radius:var(--radius-md);display:flex;align-items:flex-end;padding:8px"><span class="v">sunken — paper-200</span></div>
</div></body></html>
