<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--paper-100);font:var(--type-body);color:var(--text-body)}.row{display:flex;gap:var(--space-md);align-items:stretch}.col{display:flex;flex-direction:column;gap:var(--space-sm)}.sw{flex:1 1 0;min-width:0;border-radius:var(--radius-sm);border:1px solid rgba(22,33,28,.10);padding:var(--space-sm);display:flex;flex-direction:column;justify-content:flex-end;height:0px}.n{font:var(--type-mono);font-size:10px;letter-spacing:.02em}.v{font:var(--type-mono);font-size:10px;opacity:.75}.cap{font-family:var(--font-body);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted)}</style></head><body>
<div style="display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:baseline">
<div class="v">--size-display-xl</div><div style="font-family:var(--font-display);font-weight:600;font-size:26px;letter-spacing:-.015em;color:var(--text-strong)">64px</div><div class="v">--size-display-lg</div><div style="font-family:var(--font-display);font-weight:600;font-size:26px;letter-spacing:-.015em;color:var(--text-strong)">48px</div><div class="v">--size-display-md</div><div style="font-family:var(--font-display);font-weight:600;font-size:26px;letter-spacing:-.015em;color:var(--text-strong)">36px</div><div class="v">--size-title-lg</div><div style="font-family:var(--font-display);font-weight:600;font-size:26px;letter-spacing:-.015em;color:var(--text-strong)">28px</div><div class="v">--size-title-md</div><div style="font-family:var(--font-display);font-weight:600;font-size:22px;letter-spacing:-.015em;color:var(--text-strong)">22px</div><div class="v">--size-title-sm</div><div style="font-family:var(--font-display);font-weight:600;font-size:18px;letter-spacing:-.015em;color:var(--text-strong)">18px</div><div class="v">--size-body-lg</div><div style="font-family:var(--font-display);font-weight:600;font-size:17px;letter-spacing:-.015em;color:var(--text-strong)">17px</div><div class="v">--size-body-md</div><div style="font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:-.015em;color:var(--text-strong)">15px</div><div class="v">--size-body-sm</div><div style="font-family:var(--font-display);font-weight:600;font-size:13px;letter-spacing:-.015em;color:var(--text-strong)">13px</div><div class="v">--size-label</div><div style="font-family:var(--font-display);font-weight:600;font-size:12px;letter-spacing:-.015em;color:var(--text-strong)">12px</div><div class="v">--size-micro</div><div style="font-family:var(--font-display);font-weight:600;font-size:11px;letter-spacing:-.015em;color:var(--text-strong)">11px</div>
</div></body></html>
