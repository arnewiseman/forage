<!-- @dsCard group="Shape" viewport="700x150" name="Borders" subtitle="1px hairline for calm surfaces, 1.5px for controls, 2px ink for emphasis." -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--paper-100);font:var(--type-body);color:var(--text-body)}.row{display:flex;gap:var(--space-md);align-items:stretch}.col{display:flex;flex-direction:column;gap:var(--space-sm)}.sw{flex:1 1 0;min-width:0;border-radius:var(--radius-sm);border:1px solid rgba(22,33,28,.10);padding:var(--space-sm);display:flex;flex-direction:column;justify-content:flex-end;height:0px}.n{font:var(--type-mono);font-size:10px;letter-spacing:.02em}.v{font:var(--type-mono);font-size:10px;opacity:.75}.cap{font-family:var(--font-body);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted)}</style></head><body>
<div class="row" style="gap:14px">
<div class="col" style="gap:6px;flex:1 1 0;align-items:center"><div style="width:100%;height:56px;background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:var(--radius-md)"></div><div class="v" style="text-align:center">1px hairline</div></div><div class="col" style="gap:6px;flex:1 1 0;align-items:center"><div style="width:100%;height:56px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-md)"></div><div class="v" style="text-align:center">1px default</div></div><div class="col" style="gap:6px;flex:1 1 0;align-items:center"><div style="width:100%;height:56px;background:var(--surface-card);border:1.5px solid var(--border-strong);border-radius:var(--radius-md)"></div><div class="v" style="text-align:center">1.5px control</div></div><div class="col" style="gap:6px;flex:1 1 0;align-items:center"><div style="width:100%;height:56px;background:var(--surface-card);border:2px solid var(--ink-900);border-radius:var(--radius-md)"></div><div class="v" style="text-align:center">2px heavy ink</div></div><div class="col" style="gap:6px;flex:1 1 0;align-items:center"><div style="width:100%;height:56px;background:var(--surface-card);border:1px dashed var(--rain-500);border-radius:var(--radius-md)"></div><div class="v" style="text-align:center">1px dashed rain</div></div>
</div></body></html>
