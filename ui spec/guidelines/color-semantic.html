<!-- @dsCard group="Colors" viewport="700x160" name="Status colours" subtitle="Positive = moss, caution = amber, critical = rose, info = hood. Surface + text pairs." -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--paper-100);font:var(--type-body);color:var(--text-body)}.row{display:flex;gap:var(--space-md);align-items:stretch}.col{display:flex;flex-direction:column;gap:var(--space-sm)}.sw{flex:1 1 0;min-width:0;border-radius:var(--radius-sm);border:1px solid rgba(22,33,28,.10);padding:var(--space-sm);display:flex;flex-direction:column;justify-content:flex-end;height:0px}.n{font:var(--type-mono);font-size:10px;letter-spacing:.02em}.v{font:var(--type-mono);font-size:10px;opacity:.75}.cap{font-family:var(--font-body);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted)}</style></head><body>
<div class="row" style="gap:var(--space-md)">
<div style="flex:1 1 0;border-radius:var(--radius-md);border:1px solid var(--border-hairline);overflow:hidden">
<div style="background:var(--status-positive-surface);color:var(--status-positive);padding:14px 12px;font-weight:700;font-size:13px">Positive</div>
<div style="padding:8px 12px;background:var(--surface-card)"><div class="v">--status-positive</div><div class="v">--status-positive-surface</div></div></div><div style="flex:1 1 0;border-radius:var(--radius-md);border:1px solid var(--border-hairline);overflow:hidden">
<div style="background:var(--status-caution-surface);color:var(--status-caution);padding:14px 12px;font-weight:700;font-size:13px">Caution</div>
<div style="padding:8px 12px;background:var(--surface-card)"><div class="v">--status-caution</div><div class="v">--status-caution-surface</div></div></div><div style="flex:1 1 0;border-radius:var(--radius-md);border:1px solid var(--border-hairline);overflow:hidden">
<div style="background:var(--status-critical-surface);color:var(--status-critical);padding:14px 12px;font-weight:700;font-size:13px">Critical</div>
<div style="padding:8px 12px;background:var(--surface-card)"><div class="v">--status-critical</div><div class="v">--status-critical-surface</div></div></div><div style="flex:1 1 0;border-radius:var(--radius-md);border:1px solid var(--border-hairline);overflow:hidden">
<div style="background:var(--status-info-surface);color:var(--status-info);padding:14px 12px;font-weight:700;font-size:13px">Info</div>
<div style="padding:8px 12px;background:var(--surface-card)"><div class="v">--status-info</div><div class="v">--status-info-surface</div></div></div>
</div></body></html>
