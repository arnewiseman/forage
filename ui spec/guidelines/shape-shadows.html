<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--paper-100);font:var(--type-body);color:var(--text-body)}.row{display:flex;gap:var(--space-md);align-items:stretch}.col{display:flex;flex-direction:column;gap:var(--space-sm)}.sw{flex:1 1 0;min-width:0;border-radius:var(--radius-sm);border:1px solid rgba(22,33,28,.10);padding:var(--space-sm);display:flex;flex-direction:column;justify-content:flex-end;height:0px}.n{font:var(--type-mono);font-size:10px;letter-spacing:.02em}.v{font:var(--type-mono);font-size:10px;opacity:.75}.cap{font-family:var(--font-body);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted)}</style></head><body>
<div class="row" style="gap:18px;padding:6px 4px 10px">
<div class="col" style="gap:8px;flex:1 1 0;align-items:center"><div style="width:100%;height:56px;background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:var(--radius-md);box-shadow:var(--shadow-1)"></div><div class="v" style="text-align:center">--shadow-1</div></div><div class="col" style="gap:8px;flex:1 1 0;align-items:center"><div style="width:100%;height:56px;background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:var(--radius-md);box-shadow:var(--shadow-2)"></div><div class="v" style="text-align:center">--shadow-2</div></div><div class="col" style="gap:8px;flex:1 1 0;align-items:center"><div style="width:100%;height:56px;background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:var(--radius-md);box-shadow:var(--shadow-3)"></div><div class="v" style="text-align:center">--shadow-3</div></div><div class="col" style="gap:8px;flex:1 1 0;align-items:center"><div style="width:100%;height:56px;background:var(--surface-card);border:1.5px solid var(--ink-900);border-radius:var(--radius-md);box-shadow:var(--shadow-print)"></div><div class="v" style="text-align:center">--shadow-print</div></div><div class="col" style="gap:8px;flex:1 1 0;align-items:center"><div style="width:100%;height:56px;background:var(--surface-card);border:1.5px solid var(--rose-600);border-radius:var(--radius-md);box-shadow:var(--shadow-print-rose)"></div><div class="v" style="text-align:center">--shadow-print-rose</div></div>
