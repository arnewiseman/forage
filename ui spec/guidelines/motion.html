<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--paper-100);font:var(--type-body);color:var(--text-body)}.row{display:flex;gap:var(--space-md);align-items:stretch}.col{display:flex;flex-direction:column;gap:var(--space-sm)}.sw{flex:1 1 0;min-width:0;border-radius:var(--radius-sm);border:1px solid rgba(22,33,28,.10);padding:var(--space-sm);display:flex;flex-direction:column;justify-content:flex-end;height:0px}.n{font:var(--type-mono);font-size:10px;letter-spacing:.02em}.v{font:var(--type-mono);font-size:10px;opacity:.75}.cap{font-family:var(--font-body);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted)}</style></head><body>
<div class="col" style="gap:12px">
<div class="row" style="gap:20px"><div class="col" style="gap:2px;flex:1 1 0"><div style="font:var(--type-mono);font-size:15px;color:var(--text-strong)">80ms</div><div class="v">--duration-instant</div><div class="v" style="opacity:.6">hover tints</div></div><div class="col" style="gap:2px;flex:1 1 0"><div style="font:var(--type-mono);font-size:15px;color:var(--text-strong)">130ms</div><div class="v">--duration-fast</div><div class="v" style="opacity:.6">controls</div></div><div class="col" style="gap:2px;flex:1 1 0"><div style="font:var(--type-mono);font-size:15px;color:var(--text-strong)">190ms</div><div class="v">--duration-base</div><div class="v" style="opacity:.6">panels, dialogs</div></div><div class="col" style="gap:2px;flex:1 1 0"><div style="font:var(--type-mono);font-size:15px;color:var(--text-strong)">280ms</div><div class="v">--duration-slow</div><div class="v" style="opacity:.6">meter fills</div></div></div>
<div style="border-top:1px solid var(--border-hairline);padding-top:10px" class="v">--ease-standard cubic-bezier(.2,.7,.2,1) &nbsp;·&nbsp; --ease-entrance cubic-bezier(.16,.84,.32,1) &nbsp;·&nbsp; --ease-exit cubic-bezier(.4,0,.9,.4)</div>
</div></body></html>
